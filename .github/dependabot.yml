version: 2

updates:
  # ── Root workspace (turbo, husky, prettier, lint-staged, commitlint) ──
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # Batch low-risk dev tooling into one PR to cut review noise.
      dev-tooling:
        patterns:
          - "turbo"
          - "prettier"
          - "husky"
          - "lint-staged"
          - "@commitlint/*"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # ── API (NestJS / Prisma) ──
  - package-ecosystem: npm
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # ── Web (Next.js / React) ──
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      sentry:
        patterns:
          - "@sentry/*"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions themselves ──
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "ci(deps)"
