# Render blueprint for the Vendly NestJS API.
# https://render.com/docs/blueprint-spec
#
# Render's default Node detection runs `npm install` at the repo root, which
# can't resolve the `workspace:*` protocol used by pnpm workspaces. This
# blueprint pins pnpm, installs only the API and its workspace deps, and
# runs the production NestJS entry point.

services:
  - type: web
    name: vendly-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: |
      npm install -g pnpm@9.15.4
      pnpm install --frozen-lockfile --filter @vendly/api...
      pnpm --filter @vendly/api exec prisma generate
      pnpm --filter @vendly/api run build
    startCommand: pnpm --filter @vendly/api exec node dist/main.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 1000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      # Arkesel SMS (Ghana) — powers seller-verification admin alerts and SMS 2FA.
      # Without these, SMS-based 2FA codes silently fail to send and admin
      # notifications fall back to email-only.
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        value: Vendly
      - key: ARKESEL_SANDBOX
        value: "false"
      # Where seller-verification submissions notify (email + SMS).
      # ADMIN_NOTIFY_EMAIL falls back to SUPPORT_EMAIL if unset.
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: ADMIN_NOTIFY_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      # OAuth (Google sign-in)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OAUTH_FRONTEND_SUCCESS_URL
        sync: false
      # Sentry — error monitoring for the API. Leave SENTRY_DSN unset to
      # disable cleanly; the API logs a one-line warning and runs as normal.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_RELEASE
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0"
